<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PseudoClass</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        div:hover {
            color: red;
        }
         div > p{
            display: none;
         }
         div:hover > p{
            display: block;
            background-color: black;
         }


    </style>
</head>
<body>
    <h1>PseudoTexto</h1>
    <p>coisa escondida</p>
    <div>passe o mouse
        <p>achouuuu</p>
    </div>
 
    
</body>
</html>
